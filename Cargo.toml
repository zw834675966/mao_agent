[package]
name = "mao_agent"
version = "0.1.0"
edition = "2024"
authors = ["mao_agent developers"]
description = "High-performance vector database and intelligent agent engine for historical corpus"

[dependencies]
# Async Runtime & Utilities
tokio = { version = "1.43", features = ["full"] }
async-trait = "0.1"

# Vector Embedding (FastEmbed for local ONNX, Reqwest for remote APIs)
fastembed = { version = "4.4", optional = true }
reqwest = { version = "0.12", features = ["json", "stream"] }

# Serialization & Data Storage
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
bincode = "1.3"

# Text & NLP Processing
regex = "1.11"
unicode-segmentation = "1.12"
jieba-rs = "0.7"
strsim = "0.11"

# Full-Text Search Engine
tantivy = "0.22"

# CLI & Output Formatting
clap = { version = "4.5", features = ["derive", "env"] }

# Logging & Error Handling
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
thiserror = "2.0"

[features]
default = ["local-embed"]
local-embed = ["dep:fastembed"]

[dev-dependencies]
tempfile = "3.16"
