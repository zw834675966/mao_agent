# ==============================================================================
# DeepSeek Harness (DSH) MCP plugin patch for mao_agent
# ==============================================================================
#
# Syntax matches @deepseek-ai/dsh-mcp-client (one plugin row = one MCP server).
# Tools appear as mcp__mao__query_dialectical_principles and
# mcp__mao__verify_historical_citation.
#
# Apply ONE of the two blocks below to a profile patch, e.g.
#   ~/.dsh/profiles/<name>/cordis.patch.yml
# Do not enable both: they share serverName `mao`.
#
# Official field set: transport, serverName, command/args/env (stdio),
# url/headers (streamable-http). There is no mcpServers: map and no
# permissions.autoApprove on this plugin.
# ==============================================================================

# Option 1: Stdio (local child process)
- insert:
    - id: mcp-mao
      name: "@deepseek-ai/dsh-mcp-client"
      config:
        serverName: mao
        transport: stdio
        command: cargo
        args:
          - run
          - --release
          - --
          - mcp
          - --offline
        env:
          RUST_LOG: warn
        failOnStartupError: false

# Option 2: Streamable HTTP (shared daemon)
# Start first:
#   cargo run --release -- serve --bind 127.0.0.1:3210
# JSON POST to /mcp or /api/v1/mcp is valid Streamable HTTP
# (server MAY return application/json; SSE is optional).
#
# - insert:
#     - id: mcp-mao
#       name: "@deepseek-ai/dsh-mcp-client"
#       config:
#         serverName: mao
#         transport: streamable-http
#         url: http://127.0.0.1:3210/api/v1/mcp
#         headers:
#           Authorization: !!js '`Bearer ${process.env.MAO_API_TOKEN}`'
#         failOnStartupError: false
